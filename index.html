<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oracle Studio — Core Node Playground</title>
  
  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  
  <style>
    /* ------------------- CSS-переменные для Тем ------------------- */
    :root[data-theme="dark"] {
      --bg-primary: #131314;
      --bg-secondary: #1e1f20;
      --bg-tertiary: #28292a;
      --text-primary: #e3e2e6;
      --text-secondary: #c4c6d0;
      --border-color: #444746;
      --accent-color: #a8c7fa;
      --accent-hover: #7cacf8;
      --input-bg: #1e1f20;
    }

    :root[data-theme="light"] {
      --bg-primary: #f8f9fa;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f1f3f4;
      --text-primary: #1f1f1f;
      --text-secondary: #444746;
      --border-color: #e0e2e0;
      --accent-color: #0b57d0;
      --accent-hover: #0842a0;
      --input-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .material-symbols-outlined {
      font-size: 22px;
      vertical-align: middle;
    }

    /* ------------------- Боковая навигация (Left Sidebar) ------------------- */
    .sidebar {
      width: 240px;
      background-color: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 12px;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 1.1rem;
      color: var(--text-primary);
    }

    .nav-list {
      list-style: none;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.95rem;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
    }

    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 8px;
      background-color: var(--bg-tertiary);
      color: var(--text-primary);
      cursor: pointer;
      border: none;
      width: 100%;
      font-size: 0.9rem;
    }

    /* ------------------- Основная зона (Playground) ------------------- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      height: 60px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background-color: var(--bg-secondary);
    }

    .header-controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    select, input {
      background-color: var(--input-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      outline: none;
      font-size: 0.9rem;
    }

    .playground-grid {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 16px;
    }

    .system-instructions {
      height: 100px;
      width: 100%;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-primary);
      resize: vertical;
    }

    .prompt-canvas {
      flex: 1;
      width: 100%;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      color: var(--text-primary);
      resize: none;
    }

    /* ------------------- Правая панель настроек ------------------- */
    .settings-panel {
      width: 280px;
      background-color: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .model-card-widget {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .model-card-widget:hover {
      border-color: var(--accent-color);
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-group label {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }
  </style>
</head>
<body>

  <!-- Боковое меню -->
  <aside class="sidebar">
    <div>
      <div class="brand">
        <span class="material-symbols-outlined">auto_awesome</span>
        <span>Oracle Studio</span>
      </div>

      <ul class="nav-list">
        <a href="index.html" class="nav-item active">
          <span class="material-symbols-outlined">terminal</span>
          Playground
        </a>
        <a href="notepad.html" class="nav-item">
          <span class="material-symbols-outlined">edit_note</span>
          Notepad Helper 2
        </a>
        <a href="fast-assistant.html" class="nav-item">
          <span class="material-symbols-outlined">bolt</span>
          Fast Assistant
        </a>
        <a href="api-keys.html" class="nav-item">
          <span class="material-symbols-outlined">key</span>
          API Keys
        </a>
        <a href="settings.html" class="nav-item">
          <span class="material-symbols-outlined">settings</span>
          Настройки
        </a>
      </ul>
    </div>

    <!-- Переключатель светлой / тёмной темы -->
    <button class="theme-toggle" id="themeToggleBtn">
      <span style="display: flex; align-items: center; gap: 8px;">
        <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
        <span id="themeLabel">Тёмная тема</span>
      </span>
      <span class="material-symbols-outlined">sync_alt</span>
    </button>
  </aside>

  <!-- Главный контент -->
  <main class="main-content">
    <!-- Шапка Playground -->
    <header class="header">
      <div style="font-weight: 500;">Core Node Playground</div>
      
      <div class="header-controls">
        <!-- Выбор способа общения -->
        <select id="chatModeSelect">
          <option value="chat">Режим: Чат (Chat Prompt)</option>
          <option value="freeform">Режим: Свободный (Freeform)</option>
          <option value="structured">Режим: Структурированный</option>
        </select>
      </div>
    </header>

    <!-- Рабочая область -->
    <div class="playground-grid">
      <div class="editor-area">
        <textarea class="system-instructions" placeholder="System Instructions / Системный промпт (например, правила для Оракула)..."></textarea>
        <textarea class="prompt-canvas" placeholder="Введите ваш промпт или сообщение..."></textarea>
        <button class="btn-primary" id="runBtn" style="align-self: flex-end;">
          <span class="material-symbols-outlined">send</span>
          Запустить
        </button>
      </div>

      <!-- Правая панель настроек -->
      <aside class="settings-panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <span style="font-size: 0.85rem; color: var(--text-secondary); font-weight: 500;">Выбранная модель</span>
          <a href="models/select-model.html" style="color: var(--accent-color); font-size: 0.85rem; text-decoration: none;">Сменить</a>
        </div>

        <!-- Карточка активной модели со ссылкой в каталог -->
        <a href="models/select-model.html" style="text-decoration: none; color: inherit;">
          <div class="model-card-widget">
            <div id="activeModelName" style="font-weight: 600; font-size: 1rem; margin-bottom: 4px;">Oracle Main 2.5</div>
            <div id="activeModelDesc" style="font-size: 0.8rem; color: var(--text-secondary); line-height: 1.3;">Профессиональная и основная модель</div>
          </div>
        </a>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 4px 0;">

        <div class="setting-group">
          <label for="temp">Температура: <span id="tempVal">0.7</span></label>
          <input type="range" id="temp" min="0" max="1" step="0.05" value="0.7">
        </div>

        <div class="setting-group">
          <label for="tokens">Макс. токенов</label>
          <input type="number" id="tokens" value="4096">
        </div>

        <div class="setting-group">
          <label for="apiKey">API Key (X-Oracle-Key)</label>
          <input type="password" id="apiKey" placeholder="or_live_xxxxxxxx">
        </div>
      </aside>
    </div>
  </main>

  <!-- Подключение единого реестра моделей -->
  <script src="models.js"></script>
  
  <script>
    // --- 1. Логика темы ---
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    const themeLabel = document.getElementById('themeLabel');
    const htmlEl = document.documentElement;

    const savedTheme = localStorage.getItem('oracle_theme') || 'dark';
    setTheme(savedTheme);

    themeToggleBtn.addEventListener('click', () => {
      const currentTheme = htmlEl.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      setTheme(newTheme);
    });

    function setTheme(theme) {
      htmlEl.setAttribute('data-theme', theme);
      localStorage.setItem('oracle_theme', theme);
      themeIcon.textContent = theme === 'dark' ? 'dark_mode' : 'light_mode';
      themeLabel.textContent = theme === 'dark' ? 'Тёмная тема' : 'Светлая тема';
    }

    // --- 2. Инициализация выбранной модели из models.js ---
    const currentModel = getSelectedModel();
    document.getElementById('activeModelName').textContent = currentModel.name;
    document.getElementById('activeModelDesc').textContent = currentModel.description;

    // Автоподгрузка API ключа
    const apiKeyInput = document.getElementById('apiKey');
    const savedKeys = JSON.parse(localStorage.getItem('oracle_api_keys') || '[]');
    if (savedKeys.length > 0) {
      apiKeyInput.value = savedKeys[0].key;
    }

    // Ползунок температуры
    const tempInput = document.getElementById('temp');
    const tempVal = document.getElementById('tempVal');
    tempInput.addEventListener('input', (e) => {
      tempVal.textContent = e.target.value;
    });

    // --- 3. Логика выполнения запроса (Playground Engine) ---
    const runBtn = document.getElementById('runBtn');
    const promptCanvas = document.querySelector('.prompt-canvas');
    const systemInstructions = document.querySelector('.system-instructions');

    runBtn.addEventListener('click', async () => {
      const promptText = promptCanvas.value.trim();
      if (!promptText) {
        alert("Пожалуйста, введите текст запроса.");
        return;
      }

      runBtn.disabled = true;
      runBtn.style.opacity = "0.7";
      runBtn.innerHTML = `<span class="material-symbols-outlined">hourglass_top</span> Генерация...`;

      promptCanvas.value += "\n\n--- [Ответ Core Node] ---\n";

      const mockResponse = `[${currentModel.name}]: Запрос успешно обработан.\n` +
        `Системные правила приняты. Выбранная модель активна.\n\n` +
        `Результат выполнения анализа вашего промпта: "Всё готово к тестированию и выпуску!"`;

      await streamTextToCanvas(promptCanvas, mockResponse);

      runBtn.disabled = false;
      runBtn.style.opacity = "1";
      runBtn.innerHTML = `<span class="material-symbols-outlined">send</span> Запустить`;
    });

    function streamTextToCanvas(element, text, speed = 15) {
      return new Promise((resolve) => {
        let i = 0;
        const timer = setInterval(() => {
          element.value += text.charAt(i);
          element.scrollTop = element.scrollHeight;
          i++;
          if (i >= text.length) {
            clearInterval(timer);
            resolve();
          }
        }, speed);
      });
    }
  </script>
</body>
</html>
